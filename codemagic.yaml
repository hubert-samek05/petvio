workflows:
  ios-app-store:
    name: Petvio iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Utworz w Codemagic: Team settings -> Integrations -> App Store Connect
      # (App Store Connect API key z App Store Connect -> Users and Access -> Integrations)
      app_store_connect: petvio
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pl.petvio.mobile
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "pl.petvio.mobile"
      xcode: latest
      node: v22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          command -v pnpm >/dev/null || npm install -g pnpm
          pnpm install --no-frozen-lockfile
      - name: Firebase config (GoogleService-Info.plist)
        script: |
          # Plik w repo MA pierwszeństwo; w przeciwnym razie dekoduj ze zmiennej środowiskowej
          if [ ! -f ios/App/App/GoogleService-Info.plist ]; then
            if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
              echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/App/App/GoogleService-Info.plist
              echo "Wgrano GoogleService-Info.plist ze zmiennej"
            else
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                '<plist version="1.0"><dict>' \
                '<key>API_KEY</key><string>PLACEHOLDER_NO_FIREBASE</string>' \
                '<key>GCM_SENDER_ID</key><string>0</string>' \
                '<key>PLIST_VERSION</key><string>1</string>' \
                '<key>BUNDLE_ID</key><string>pl.petvio.mobile</string>' \
                '<key>PROJECT_ID</key><string>petvio-placeholder</string>' \
                '<key>STORAGE_BUCKET</key><string>petvio-placeholder.appspot.com</string>' \
                '<key>GOOGLE_APP_ID</key><string>1:0:ios:placeholder</string>' \
                '</dict></plist>' > ios/App/App/GoogleService-Info.plist
              echo "UWAGA: placeholder - push nie zadziala bez prawdziwego plist"
            fi
          fi
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project use-profiles
          if ! xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"; then
            echo "======== XCODEBUILD ERRORS ========"
            grep -h "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | sort -u | head -50
            echo "======== ENTITLEMENT/PROFILE ISSUES ========"
            grep -hi "doesn't include\|doesn't match\|entitlement\|provisioning profile" /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -i "error\|fail\|doesn't" | sort -u | head -20
            exit 65
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  android-release:
    name: Petvio Android (AAB)
    max_build_duration: 60
    environment:
      java: 21
      vars:
        BUNDLE_ID: "pl.petvio.mobile"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          command -v pnpm >/dev/null || npm install -g pnpm
          pnpm install --no-frozen-lockfile
      - name: Capacitor sync Android
        script: |
          npx cap sync android
      - name: Firebase config (google-services.json)
        script: |
          if [ ! -f android/app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Wgrano google-services.json ze zmiennej"
          fi
      - name: Bump versionCode
        script: |
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
